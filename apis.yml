aid: bikemap
name: Bikemap
description: Bikemap is a Vienna-based cycling platform (backed by Speedinvest) offering a route
  planner, turn-by-turn bike navigation, and one of the world's largest communities of user-generated
  cycling routes across road, mountain, gravel, and e-bike riding. Riders plan routes in a web and
  mobile route editor, discover millions of community routes, record and share rides, download offline
  maps, and sync with Garmin, Wahoo, Apple Watch, and Wear OS devices. Bikemap operates a consumer
  product surface (web, iOS, Android) and does not publish a documented public developer API; this
  profile captures its identity, published web properties, and probed domain-security posture.
